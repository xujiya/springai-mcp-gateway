global

defaults
    mode http
    timeout connect 10s
    timeout client  65s
    timeout server  65s
    option dontlognull

frontend public
    bind *:8080

    http-response del-header Server

    # /.well-known/ → api-gateway (不剥前缀)
    acl is_well_known path_beg /.well-known/
    use_backend api_gw_well_known if is_well_known

    # /api-gateway/ → api-gateway (剥 /api-gateway/ 前缀)
    acl is_api_gateway path_beg /api-gateway/
    use_backend api_gw if is_api_gateway

    # /mcp-gateway/ → mcp-gateway (剥 /mcp-gateway/ 前缀)
    acl is_mcp_gateway path_beg /mcp-gateway/
    use_backend mcp_gw if is_mcp_gateway

    default_backend reject

backend api_gw_well_known
    server s 127.0.0.1:8081
    http-request set-header Host              %[req.hdr(Host)]
    http-request set-header X-Real-IP         %[src]
    http-request set-header X-Forwarded-For   %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host  %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port  8080

backend api_gw
    server s 127.0.0.1:8081
    # 剥 /api-gateway/ 前缀: 用 set-path + path offset
    # path after /api-gateway/ is captured by removing the prefix
    http-request set-path %[path,regsub(^/api-gateway/,/)]
    http-request set-header Host              %[req.hdr(Host)]
    http-request set-header X-Real-IP         %[src]
    http-request set-header X-Forwarded-For   %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host  %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port  8080
    http-request set-header X-Forwarded-Prefix /api-gateway

backend mcp_gw
    server s 127.0.0.1:8082
    http-request set-path %[path,regsub(^/mcp-gateway/,/)]
    http-request set-header Host              %[req.hdr(Host)]
    http-request set-header X-Real-IP         %[src]
    http-request set-header X-Forwarded-For   %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host  %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port  8080
    http-request set-header X-Forwarded-Prefix /mcp-gateway
    timeout server 3600s
    timeout tunnel 3600s

backend reject
    http-request return status 404 content-type "text/plain" string "404"
