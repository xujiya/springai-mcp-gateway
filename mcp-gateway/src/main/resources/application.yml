server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: springai-mcp-gateway
  datasource:
    url: >-
      jdbc:mysql://localhost:3306/mcp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: xujiya
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        enabled: false
        protocol: streamable
        name: ${spring.application.name}
      client:
        enabled: false
        name: mcp-client
        version: 1.0.0
        toolcallback:
          enabled: false
        request-timeout: 30s
        sse:
          connections: {}
        streamable-http:
          connections:
            weather:
              url: http://localhost:9092/mcp
            climate:
              url: http://localhost:9093/mcp
            # 注意：此配置需与 ecso.mcp.services 保持同步
            # order:
            #   url: http://localhost:9094/mcp
        stdio:
          root-change-notification: false
          connections: {}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/api-gateway/ecso/auth
          jwk-set-uri: http://localhost:9090/oauth2/jwks

ecso:
  cors:
    allowed-origins: >-
      https://dev.omarall.es,http://app.omarall.es:*,http://app.omarall.es:8080
  auth-server:
    public-url: http://localhost:8080/api-gateway/ecso/auth
  mcp-server:
    public-url: http://localhost:8080/mcp-gateway
  mcp:
    services:
      weather:
        url: http://localhost:9092/mcp
      climate:
        url: http://localhost:9093/mcp
      # ── 扩展示例：添加新 MCP 服务器只需追加配置 ──
      # order:
      #   url: http://localhost:9094/mcp
      # ticket:
      #   url: http://localhost:9095/mcp
      # billing:
      #   url: http://localhost:9096/mcp
    api-key:
      enabled: true
      header-name: X-API-Key
      # admin-token 已移除 — admin API 现在走 JWT（auth-server client_credentials）

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID

logging:
  level:
    es.omarall: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.ai: TRACE
    org.springframework.security: TRACE
