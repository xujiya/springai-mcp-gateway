server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: springai-mcp-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/mcp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: xujiya
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        enabled: false      # No MCP server endpoint — gateway is pure proxy, not an MCP server
        protocol: streamable
        name: ${spring.application.name}
      client:
        enabled: false       # No MCP client aggregation — use transparent proxy via McpServiceRouterController
        name: mcp-client
        version: 1.0.0
        toolcallback:
          enabled: false
        request-timeout: 30s
        sse:
          connections: {}
        streamable-http:
          connections:
            weather:
              url: http://localhost:9092/mcp
            climate:
              url: http://localhost:9093/mcp
        stdio:
          root-change-notification: false
          connections: {}
