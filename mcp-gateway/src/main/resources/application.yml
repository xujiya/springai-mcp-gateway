  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/api-gateway/ecso/auth
          jwk-set-uri: http://localhost:9090/oauth2/jwks

ecso:
  auth-server:
    public-url: http://localhost:8080/api-gateway/ecso/auth
  mcp-server:
    public-url: http://localhost:8080/mcp-gateway
  mcp:
    services:
      weather:
        url: http://localhost:9092/mcp
      climate:
        url: http://localhost:9093/mcp
    api-key:
      enabled: true
      header-name: X-API-Key          # Header name for API Key (also accepts Authorization: Bearer ak-*)
      admin-token: mcp-admin-2025     # Bearer token for admin CRUD API

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID

logging:
  level:
    es.omarall: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.ai: TRACE
    org.springframework.security: TRACE