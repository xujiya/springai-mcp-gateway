server:
  port: 8082
  forward-headers-strategy: framework
spring:
  application:
    name: springai-mcp-gateway
  ai:
    mcp:
      server:
        enabled: true
        protocol: streamable
        name: ${spring.application.name}
      client:
        enabled: true
        name: mcp-client
        version: 1.0.0
        toolcallback:
          enabled: false   # Use our GatewayProvidersConfig @Primary provider instead
        request-timeout: 30s
        sse:
          connections: {}
        streamable-http:
          connections:
            weather:
              url: http://localhost:9092/mcp
            climate:
              url: http://localhost:9093/mcp
        stdio:
          root-change-notification: false
          connections: {}
