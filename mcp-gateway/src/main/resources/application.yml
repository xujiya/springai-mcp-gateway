  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/api-gateway/ecso/auth
          jwk-set-uri: http://localhost:9090/oauth2/jwks

mcp:
  gateway:
    prefixMode: ALIAS     # NONE | STATIC | ALIAS  — ALIAS: {connectionName}_{toolName}
    delimiter: "_"
    staticPrefix: "gw"

ecso:
  auth-server:
    public-url: http://localhost:8080/api-gateway/ecso/auth
  mcp-server:
    public-url: http://localhost:8080/mcp-gateway

logging:
  level:
    es.omarall: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.ai: TRACE
    org.springframework.security: TRACE