server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MCP_AUTHORIZATION_SERVER_SESSIONID
        path: /api-gateway/ecso/auth
        http-only: true
        secure: false # 开发HTTP; 生产改true
        same-site: lax

# MCP DCR (Dynamic Client Registration) security settings
# These apply to clients registered via POST /oauth2/register
mcp:
  dcr:
    enabled: true # DCR\u5f00\u5173
    client-secret-expires-in: 90d
    access-token-time-to-live: 24h
    refresh-token-time-to-live: 1h

ecso:
  cors:
    allowed-origins: >-
      https://dev.omarall.es,http://app.omarall.es:*,http://app.omarall.es:8080

spring:
  application:
    name: auth-server

  datasource:
    url: >-
      jdbc:mysql://localhost:3306/mcp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: xujiya
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080/api-gateway/ecso/auth

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID

logging:
  level:
    org.springframework.security: WARN
