server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MCP_AUTHORIZATION_SERVER_SESSIONID

spring:
  application:
    name: auth-server

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080/api-gateway/ecso/auth
        client:
          springai-gateway-client:
            token:
              access-token-time-to-live: 1h
              refresh-token-time-to-live: 30d
            registration:
              client-id: "springai-gateway-client"
              client-name: "Spring AI MCP Gateway"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "none"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              scopes:
                - "offline_access"
                - "mcp:read"
                - "mcp:write"
              redirect-uris:
                - "http://localhost:6274/oauth/callback"
                - "https://claude.ai/api/mcp/auth_callback"
                - "http://localhost:8080/login/oauth2/code/authserver"
                - "http://127.0.0.1:8080/login/oauth2/code/authserver"
              require-authorization-consent: false
              require-proof-key-for-code-exchange: true
    user:
      name: admin
      password: admin



logging:
  level:
    org.springframework.security: WARN
