server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MCP_AUTHORIZATION_SERVER_SESSIONID

# MCP DCR (Dynamic Client Registration) security settings
# These apply to clients registered via POST /oauth2/register
mcp:
  dcr:
    enabled: false               # 生产环境关闭 DCR，使用预注册
    client-secret-expires-in: 90d    # How long DCR client secrets remain valid (default: 90d)
    access-token-time-to-live: 24h   # Access token TTL for DCR-registered clients (default: 5m)
    refresh-token-time-to-live: 1h   # Refresh token TTL for DCR-registered clients (default: 1h)

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:mysql://localhost:3306/mcp_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: xujiya
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080/api-gateway/ecso/auth

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID

logging:
  level:
    org.springframework.security: WARN
