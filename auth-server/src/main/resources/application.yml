server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MCP_AUTHORIZATION_SERVER_SESSIONID

# MCP DCR (Dynamic Client Registration) security settings
# These apply to clients registered via POST /oauth2/register
mcp:
  dcr:
    client-secret-expires-in: 90d    # How long DCR client secrets remain valid (default: 90d)
    access-token-time-to-live: 24h   # Access token TTL for DCR-registered clients (default: 5m)
    refresh-token-time-to-live: 1h   # Refresh token TTL for DCR-registered clients (default: 1h)

spring:
  application:
    name: auth-server

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080/api-gateway/ecso/auth
        client:
          springai-gateway-client:
            token:
              access-token-time-to-live: 1h
              refresh-token-time-to-live: 30d
            registration:
              client-id: "springai-gateway-client"
              client-name: "Spring AI MCP Gateway"
              client-secret: "{bcrypt}$2b$10$ABsfnCtp6Hkmzsk4myJCee0MHC/ogOWXR/DPKQMDI0VLXakrvKo46"
              client-authentication-methods:
                - "client_secret_post"
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "client_credentials"
                - "refresh_token"
              scopes:
                - "offline_access"
                - "mcp:read"
                - "mcp:write"
              redirect-uris:
                - "http://localhost:6274/oauth/callback"
                - "https://claude.ai/api/mcp/auth_callback"
                - "http://localhost:8080/login/oauth2/code/authserver"
                - "http://127.0.0.1:8080/login/oauth2/code/authserver"
              require-authorization-consent: false
              require-proof-key-for-code-exchange: true
    user:
      name: admin
      password: admin



logging:
  level:
    org.springframework.security: WARN
